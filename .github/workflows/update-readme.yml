name: Update README

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Update repository information
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref_name;

            // 1. Get repository information
            const { data: repository } =
              await github.rest.repos.get({
                owner,
                repo
              });

            // 2. Read README from the current branch
            const { data: file } =
              await github.rest.repos.getContent({
                owner,
                repo,
                path: 'README.md',
                ref: branch
              });

            if (Array.isArray(file) || !file.content) {
              throw new Error(
                'README.md was not returned as a file.'
              );
            }

            const content = Buffer
              .from(file.content, 'base64')
              .toString('utf8');

            // 3. Validate markers
            const startMarker = '<!-- AUTO-UPDATE:START -->';
            const endMarker = '<!-- AUTO-UPDATE:END -->';

            if (
              content.split(startMarker).length !== 2 ||
              content.split(endMarker).length !== 2
            ) {
              throw new Error(
                'README must contain exactly one START and END marker.'
              );
            }

            const start = content.indexOf(startMarker);
            const end = content.indexOf(endMarker);

            if (end < start + startMarker.length) {
              throw new Error(
                'README markers are in the wrong order.'
              );
            }

            // 4. Generate updated content
            const updatedSection = [
              '',
              `- **Repository:** ${repository.full_name}`,
              `- **Description:** ${repository.description || 'No description'}`,
              `- **Default Branch:** ${repository.default_branch}`,
              `- **Last Updated:** ${new Date().toISOString()}`,
              ''
            ].join('\n');

            const newContent =
              content.slice(0, start + startMarker.length) +
              updatedSection +
              content.slice(end);

            // 5. Skip the commit if nothing changed
            if (newContent === content) {
              core.info('README is already up to date.');
              return;
            }

            // 6. Update README on the current branch
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'README.md',
              message: 'chore: automatically update README',
              content: Buffer.from(newContent, 'utf8').toString('base64'),
              sha: file.sha,
              branch
            });

            core.info('README updated successfully.');
